name: Dependency audit

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Install the reviewed audit runtime
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-test.txt
          python -m pip check
      - name: Query live advisories for the production closure
        timeout-minutes: 5
        run: >-
          python -m pip_audit
          --requirement requirements-tools.txt
          --require-hashes --disable-pip --strict
          --vulnerability-service pypi --timeout 10
          --progress-spinner off --desc off --aliases off

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run audit:dependencies
