name: Reviewer registration contract

on:
  schedule:
    - cron: "51 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "schema-v3.json"
      - "tools/**"
      - "tests/fixtures/**"
      - "requirements-test.txt"
      - ".github/workflows/reviewer-contract.yml"
  # `register` is a required branch-protection context, so every pull request
  # must create it. A path filter here leaves documentation-only pull requests
  # permanently blocked with an Expected check that can never start.
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: reviewer-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          path: database-tools
      - name: Resolve coordinated contract branches
        id: contract-refs
        env:
          COORDINATED_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          resolve_ref() {
            repository="$1"
            if [ -n "$COORDINATED_REF" ] && git ls-remote --exit-code --heads \
              "https://github.com/$repository.git" \
              "refs/heads/$COORDINATED_REF" >/dev/null 2>&1; then
              printf '%s\n' "$COORDINATED_REF"
            else
              printf '%s\n' main
            fi
          }
          echo "reviewer=$(resolve_ref PalomarRegistry/PalomarReviewer)" >> "$GITHUB_OUTPUT"
          echo "policy=$(resolve_ref PalomarRegistry/PalomarPolicy)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarReviewer
          ref: ${{ steps.contract-refs.outputs.reviewer }}
          fetch-depth: 1
          persist-credentials: false
          path: reviewer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarPolicy
          ref: ${{ steps.contract-refs.outputs.policy }}
          fetch-depth: 1
          persist-credentials: false
          path: policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Install the reviewed database-tool closure
        working-directory: database-tools
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Build a committed synthetic database
        working-directory: database-tools
        run: |
          python - <<'PY'
          import pathlib
          import shutil
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "tests"))
          from conftest import Database

          database = Database(root.parent / "database")
          shutil.copytree(
              root / "tools",
              database.path / "tools",
              ignore=shutil.ignore_patterns("__pycache__", "*.pyc"),
          )
          shutil.copytree(root / "tests" / "fixtures", database.path / "tests" / "fixtures")
          shutil.copy(root / "requirements-tools.txt", database.path / "requirements-tools.txt")
          database.init()
          database.commit("synthetic public contract fixture")
          PY
      - name: Install the Reviewer integration subject
        working-directory: reviewer
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip check
      - name: Register and finalize against public synthetic contracts
        working-directory: reviewer
        env:
          PALOMAR_DATABASE_CHECKOUT: ${{ github.workspace }}/database
          PALOMAR_POLICY_CHECKOUT: ${{ github.workspace }}/policy
          # The sparse-checkout contract treats every untracked path as input;
          # interpreter caches must not appear inside the synthetic database.
          PYTHONDONTWRITEBYTECODE: "1"
          # Reviewer CI itself exercises both capabilities. This job's subject
          # is the database/policy registration contract.
          PALOMAR_TESTS_WITHOUT: sandbox,codex
        run: python -m unittest discover -s tests -v
