name: Deploy public-data Worker

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to deploy (must be an ancestor of main)
        required: true

permissions:
  contents: read

concurrency:
  group: public-data-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact reviewed commit
        env:
          DEPLOY_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$DEPLOY_COMMIT" origin/main
          git checkout --detach "$DEPLOY_COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install and recheck the Worker
        working-directory: worker
        run: |
          npm ci
          npm run check
          npm test
          npm run test:runtime
      - name: Deploy the inert and production environments
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env=""
          npx wrangler deploy --env production
