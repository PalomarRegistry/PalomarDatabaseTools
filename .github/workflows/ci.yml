name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Install the reviewed test closure
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-test.txt
          python -m pip check
      - name: Run synthetic tests
        run: python -m pytest -q

  runtime-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Install the pinned build frontend
        run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==83.0.0
      - name: Build the wheel twice and compare it byte-for-byte
        run: bash scripts/build-runtime.sh dist/runtime
      - name: Exercise the installed command
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-tools.txt
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --disable-pip-version-check \
            --no-deps dist/runtime/*.whl
          "$RUNNER_TEMP/runtime/bin/python" -m palomar_database_tools 2>&1 | grep '^usage:'
          mkdir "$RUNNER_TEMP/smoke-database"
          cp schema-v2.json "$RUNNER_TEMP/smoke-database/schema-v2.json"
          cp tests/fixtures/synthetic-scores-schema.json \
            "$RUNNER_TEMP/smoke-database/scores-v1.json"
          (cd "$RUNNER_TEMP/smoke-database" && \
            "$RUNNER_TEMP/runtime/bin/python" -m palomar_database_tools \
              smoke-source-availability)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palomar-database-tools-${{ github.sha }}
          path: dist/runtime/
          if-no-files-found: error
          retention-days: 90

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run types
      - run: git diff --exit-code -- worker/worker-configuration.d.ts
      - run: npm run check
      - run: npm run check:tests
      - run: npm test
      - run: npm run test:runtime
      - run: npx wrangler deploy --env="" --dry-run
      - run: npx wrangler deploy --env production --dry-run
