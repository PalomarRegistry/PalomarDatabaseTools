name: Reviewer registration contract

on:
  schedule:
    - cron: "51 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "schema-v2.json"
      - "tools/**"
      - "tests/fixtures/**"
      - "requirements-test.txt"
      - ".github/workflows/reviewer-contract.yml"
  pull_request:
    paths:
      - "schema-v2.json"
      - "tools/**"
      - "tests/fixtures/**"
      - "requirements-test.txt"
      - ".github/workflows/reviewer-contract.yml"

permissions:
  contents: read

concurrency:
  group: reviewer-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          path: database-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarReviewer
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: reviewer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarPolicy
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Install the reviewed database-tool closure
        working-directory: database-tools
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Build a committed synthetic database
        working-directory: database-tools
        run: |
          python - <<'PY'
          import pathlib
          import shutil
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "tests"))
          from conftest import Database

          database = Database(root.parent / "database")
          shutil.copytree(root / "tools", database.path / "tools")
          shutil.copytree(root / "tests" / "fixtures", database.path / "tests" / "fixtures")
          shutil.copy(root / "requirements-tools.txt", database.path / "requirements-tools.txt")
          database.init()
          database.commit("synthetic public contract fixture")
          PY
      - name: Install the Reviewer integration subject
        working-directory: reviewer
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip check
      - name: Register and finalize against public synthetic contracts
        working-directory: reviewer
        env:
          PALOMAR_DATABASE_CHECKOUT: ${{ github.workspace }}/database
          PALOMAR_POLICY_CHECKOUT: ${{ github.workspace }}/policy
          # Reviewer CI itself exercises both capabilities. This job's subject
          # is the database/policy registration contract.
          PALOMAR_TESTS_WITHOUT: sandbox,codex
        run: python -m unittest discover -s tests -v
